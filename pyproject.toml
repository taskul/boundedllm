# The same installable package backs embedded integrations, the CLI, and the API.
[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "boundedllm"
version = "0.4.0"
description = "Bound what a compromised LLM agent can reach and do"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Tastan Kulmeshkenov", email = "tastankulmeshkenov@gmail.com" }]
keywords = [
  "llm", "agent", "security", "prompt-injection", "authorization",
  "multi-tenant", "audit", "guardrails", "rag", "ai-safety",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
# The core is the turn engine plus the port contracts. It validates data and
# nothing else, so a host embedding it pays for no database driver, HTTP client,
# or web framework it did not ask for. Everything below is an adapter.
dependencies = ["pydantic>=2.12,<3"]

[project.optional-dependencies]
# The bundled SQL implementation of every port.
sql = ["sqlalchemy>=2.0.48,<3", "pydantic-settings>=2.13,<3", "alembic>=1.16,<2"]
postgres = ["psycopg[binary]>=3.3,<4"]
# The reference HTTP adapter, its JWT authenticator, and outbound transports.
api = [
  "fastapi>=0.135,<1", "uvicorn>=0.41,<1", "pydantic-settings>=2.13,<3",
  "httpx>=0.28,<1", "PyJWT[crypto]>=2.12,<3", "cryptography>=50,<51",
  "sqlalchemy>=2.0.48,<3",
]
# Everything, which is what the reference deployment and CI install.
all = [
  "boundedllm[sql,postgres,api]",
]
# Ready-made port implementations in boundedllm.contrib.
pgvector = ["psycopg[binary,pool]>=3.3,<4"]
anthropic = ["anthropic>=0.75,<2"]
# Presidio is optional because deployments must choose and evaluate their own DLP.
pii = ["presidio-analyzer>=2.2,<3", "presidio-anonymizer>=2.2,<3"]
telemetry = [
  "opentelemetry-api>=1.39,<2", "opentelemetry-sdk>=1.39,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
]

[dependency-groups]
dev = [
  "boundedllm[all]",
  "pytest>=8.4,<10", "pytest-asyncio>=1.3,<2", "ruff>=0.15,<1",
  "pip-audit>=2.10,<3", "build>=1.4,<2",
]

[project.urls]
# PyPI renders these as sidebar links. Replace ORG with your GitHub account.
Homepage = "https://github.com/taskul/boundedllm"
Repository = "https://github.com/taskul/boundedllm"
Changelog = "https://github.com/taskul/boundedllm/blob/main/CHANGELOG.md"
Issues = "https://github.com/taskul/boundedllm/issues"
"Security Policy" = "https://github.com/taskul/boundedllm/blob/main/SECURITY.md"

[project.scripts]
boundedllm = "boundedllm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/boundedllm"]
# Migrations are part of the shipped adapter, not repository tooling. Without
# these the wheel installs a package whose documented production path cannot run.
artifacts = [
  "src/boundedllm/adapters/sql/alembic.ini",
  "src/boundedllm/adapters/sql/migrations/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repository root on sys.path. Without this, `pytest` works only when
# invoked as `python -m pytest`, which silently inserts the working directory.
# CI runs the console script, so a test importing a sibling package passed
# locally and failed there.
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["postgres: requires TEST_POSTGRES_URL pointing to a disposable PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Tests construct SQL against the adapter's own validated table name and run
# a known interpreter on a file they just wrote.
"tests/*" = ["S105", "S106", "S603", "S608"]
