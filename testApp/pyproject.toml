# This separate application consumes the root project exactly as an installed dependency.
[project]
name = "roadshield-attack-lab"
version = "0.1.0"
description = "Synthetic car-insurance agent used to exercise boundedllm"
requires-python = ">=3.11"
dependencies = [
  # The lab uses the SQL adapter, the reference support domain, and Claude.
  "boundedllm[sql,anthropic]",
  "fastapi>=0.135,<1",
  "httpx>=0.28,<1",
  "pypdf>=6.1,<7",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0.48,<3",
  "truststore>=0.10,<1",
  "uvicorn>=0.41,<1",
]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.16,<1"]

[tool.uv.sources]
# uv installs the library from the parent checkout, so tests cover the package under development.
boundedllm = { path = "..", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repository root on sys.path. Without this, `pytest` works only when
# invoked as `python -m pytest`, which silently inserts the working directory.
# CI runs the console script, so a test importing a sibling package passed
# locally and failed there.
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S107"]
